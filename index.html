<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAEPVision</title>


<style>



:root{

  --white:#ffffff;
  --black:#000000;
  --red:#ff0000;
  --gray:#666666;
  --light-gray:#eeeeee;

}




*{

  box-sizing:border-box;
  margin:0;
  padding:0;

}


body{

  font-family:
    'Segoe UI',
    Arial,
    sans-serif;

  background:var(--white);

  color:var(--black);

  min-height:100vh;

}


button{

  font-family:inherit;
  cursor:pointer;

}


.hidden{

  display:none !important;

}


header.app-header{

  background:var(--black);

  color:var(--white);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:14px 30px;

  position:sticky;

  top:0;

  z-index:50;

  box-shadow:
    0 3px 18px rgba(0,0,0,.14);

}


.user-section{

  display:flex;

  align-items:center;

  gap:10px;

  min-width:220px;

}


.user-section img.avatar{

  width:40px;
  height:40px;

  border-radius:50%;

  object-fit:cover;

  border:2px solid var(--white);

  background:#333;

}


.user-section .user-name{

  font-size:14px;

  line-height:1.2;

}


.user-section .user-name small{

  display:block;

  opacity:.7;

  font-size:11px;

}


.btn-ver-perfil{

  background:transparent;

  border:1px solid var(--white);

  color:var(--white);

  padding:7px 13px;

  border-radius:999px;

  font-size:13px;

  transition:.2s;

}


.btn-ver-perfil:hover:not(:disabled){

  background:var(--white);

  color:var(--black);

}


.btn-ver-perfil:disabled{

  opacity:.35;

  cursor:not-allowed;

}


.company-section{

  flex:1;

  text-align:center;

  font-size:24px;

  font-weight:700;

  letter-spacing:1.5px;

}


.login-section{

  min-width:220px;

  display:flex;

  justify-content:flex-end;

}


.btn-login-header,
.btn-logout{

  background:var(--white);

  color:var(--black);

  border:none;

  padding:9px 20px;

  border-radius:999px;

  font-weight:600;

  font-size:14px;

  transition:.2s;

}


.btn-login-header:hover,
.btn-logout:hover{

  transform:translateY(-1px);

}


/* =========================================================
   CONTEÚDO
   ========================================================= */

main{

  max-width:1180px;

  margin:0 auto;

  padding:34px 24px;

  min-height:calc(100vh - 150px);

}


/* =========================================================
   BUSCA
   ========================================================= */

.search-bar{

  position:relative;

  max-width:620px;

  margin:0 auto 34px;

}


.search-bar input{

  width:100%;

  padding:14px 48px 14px 18px;

  border:1px solid #bbb;

  border-radius:999px;

  font-size:14px;

  outline:none;

  background:#fff;

  box-shadow:
    0 4px 18px rgba(0,0,0,.06);

}


.search-bar input:focus{

  border-color:#000;

  box-shadow:
    0 0 0 4px rgba(0,0,0,.08);

}


.search-bar svg{

  position:absolute;

  right:16px;

  top:50%;

  transform:translateY(-50%);

  width:18px;

  height:18px;

  pointer-events:none;

}


.search-message{

  text-align:center;

  padding:30px 0;

  font-size:15px;

  color:#555;

}


/* =========================================================
   GALERIA
   ========================================================= */

.gallery{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:24px;

}


@media(max-width:800px){

  .gallery{

    grid-template-columns:
      repeat(2,1fr);

  }

}


@media(max-width:520px){

  .gallery{

    grid-template-columns:1fr;

  }

}


/* =========================================================
   CARD
   ========================================================= */

.card{

  border:1px solid #ddd;

  border-radius:14px;

  overflow:hidden;

  background:var(--white);

  box-shadow:
    0 5px 20px rgba(0,0,0,.06);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}


.card:hover{

  transform:translateY(-4px);

  box-shadow:
    0 12px 28px rgba(0,0,0,.12);

}


.card .img-wrap{

  position:relative;

  width:100%;

  height:240px;

  overflow:hidden;

  background:#eee;

}


.card .img-wrap img{

  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  transition:
    transform .3s ease;

}


.card:hover .img-wrap img{

  transform:scale(1.05);

}


/* =========================================================
   INFORMAÇÕES DA FOTO
   ========================================================= */

.card-info-overlay{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:18px;

  color:white;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.92)
    );

  opacity:0;

  transform:translateY(15px);

  transition:
    opacity .25s ease,
    transform .25s ease;

}


.card:hover .card-info-overlay{

  opacity:1;

  transform:translateY(0);

}


.card-info-overlay h3{

  font-size:18px;

  margin-bottom:4px;

}


.card-info-overlay p{

  font-size:14px;

  margin-bottom:3px;

}


.card-info-overlay small{

  font-size:12px;

  opacity:.85;

}


/* =========================================================
   CURTIDA
   ========================================================= */

.like-box{

  position:absolute;

  top:12px;
  right:12px;

  display:flex;

  align-items:center;

  gap:5px;

  background:rgba(255,255,255,.92);

  border:none;

  border-radius:999px;

  padding:7px 10px;

  opacity:0;

  transform:translateY(-5px);

  transition:.2s;

}


.card:hover .like-box{

  opacity:1;

  transform:translateY(0);

}


.like-box svg{

  width:20px;
  height:20px;

}


.like-count{

  font-size:13px;

  font-weight:600;

}


/* =========================================================
   FOOTER
   ========================================================= */

footer{

  background:var(--black);

  color:var(--white);

  display:grid;

  grid-template-columns:
    1fr auto 1fr;

  align-items:center;

  padding:20px 30px;

  margin-top:40px;

}


.footer-left{

  font-weight:700;

  letter-spacing:1px;

}


.socials{

  grid-column:2;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:20px;

}


.socials svg{

  width:25px;
  height:25px;

  fill:var(--white);

  transition:.2s;

}


.socials svg:hover{

  transform:
    translateY(-2px)
    scale(1.08);

}


footer > span{

  grid-column:3;

  text-align:right;

  font-size:13px;

}


/* =========================================================
   MODAL LOGIN
   ========================================================= */

.modal-overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.62);

  backdrop-filter:blur(3px);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:2000;

}


.modal-box{

  background:var(--white);

  border-radius:18px;

  width:340px;

  max-width:90vw;

  padding:30px;

  position:relative;

  box-shadow:
    0 24px 70px rgba(0,0,0,.25);

}


.modal-close{

  position:absolute;

  top:10px;
  right:14px;

  background:none;

  border:none;

  font-size:22px;

  font-weight:700;

}


.modal-box h2{

  text-align:center;

  font-size:20px;

  margin-bottom:18px;

}


.field{

  margin-bottom:14px;

}


.field label{

  display:block;

  font-size:13px;

  font-weight:600;

  margin-bottom:5px;

}


.field input{

  width:100%;

  padding:11px 12px;

  border:1px solid #bbb;

  border-radius:9px;

  font-size:14px;

  outline:none;

}


.field input:focus{

  border-color:#000;

}


.field-error{

  color:var(--red);

  font-size:12px;

  margin-top:4px;

  min-height:14px;

}


.form-error{

  color:var(--red);

  font-size:13px;

  text-align:center;

  margin-top:6px;

  min-height:16px;

}


.modal-actions{

  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:18px;

}


.btn-cancel{

  background:transparent;

  border:1px solid #bbb;

  padding:10px 16px;

  border-radius:9px;

}


.btn-submit{

  background:var(--black);

  color:var(--white);

  border:none;

  padding:10px 20px;

  border-radius:9px;

  font-weight:600;

}


/* =========================================================
   FUNDO DA SIDEBAR
   ========================================================= */

.sidebar-overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:999;

}


/* =========================================================
   SIDEBAR DO PERFIL
   ========================================================= */

#profileSidebar{

  position:fixed;

  top:0;

  right:0;

  width:350px;

  max-width:90vw;

  height:100vh;

  background:#fff;

  z-index:1000;

  overflow-y:auto;

  box-shadow:
    -8px 0 25px rgba(0,0,0,.18);

  /*
     FECHADA:
     fica fora da tela pelo lado DIREITO
  */

  transform:translateX(100%);

  transition:
    transform .35s ease;

}


/* =========================================================
   SIDEBAR ABERTA
   ========================================================= */

#profileSidebar.open{

  /*
     QUANDO ABRIR:
     volta para dentro da tela
  */

  transform:translateX(0);

}


/* =========================================================
   CABEÇALHO DA SIDEBAR
   ========================================================= */

.sidebar-header{

  padding:20px;

  position:relative;

  border-bottom:1px solid #ddd;

}


.sidebar-header .close-btn{

  position:absolute;

  top:12px;
  right:16px;

  background:none;

  border:none;

  font-size:30px;

  color:#333;

}


.sidebar-header h3{

  font-size:18px;

  margin-bottom:14px;

}


.sidebar-stats{

  display:flex;

  gap:30px;

}


.stat .num{

  font-size:20px;

  font-weight:700;

}


.stat .label{

  font-size:12px;

  color:#555;

}


/* =========================================================
   BOTÕES DO PERFIL
   ========================================================= */

.sidebar-buttons{

  padding:16px 20px;

  display:flex;

  flex-direction:column;

  gap:10px;

}


.btn-sidebar{

  width:100%;

  padding:11px;

  border-radius:9px;

  font-size:14px;

  font-weight:600;

  transition:.2s;

}


.btn-sidebar:hover{

  transform:translateY(-1px);

}


.btn-publicacoes{

  background:var(--white);

  color:var(--black);

  border:1px solid var(--black);

}


.btn-nova-pub{

  background:var(--black);

  color:var(--white);

  border:none;

}


/* =========================================================
   PUBLICAÇÕES
   ========================================================= */

.own-publications{

  padding:0 20px 20px;

}


.own-publications-title{

  font-size:15px;

  font-weight:700;

  margin-bottom:12px;

}


.own-pub-item{

  display:flex;

  gap:10px;

  align-items:center;

  padding:12px 0;

  border-bottom:1px solid #eee;

}


.own-pub-image{

  width:70px;
  height:55px;

  border-radius:8px;

  object-fit:cover;

  flex-shrink:0;

}


.own-pub-info{

  flex:1;

  min-width:0;

}


.own-pub-title{

  font-size:13px;

  font-weight:700;

  margin-bottom:3px;

}


.own-pub-local{

  font-size:11px;

  color:#666;

}


.own-pub-number{

  font-size:11px;

  color:#999;

  margin-bottom:2px;

}


.trash-btn{

  background:none;

  border:none;

  flex-shrink:0;

}


.trash-btn svg{

  width:19px;
  height:19px;

  fill:var(--red);

}


.empty-msg{

  font-size:13px;

  color:#777;

  padding:20px 0;

  text-align:center;

}


/* =========================================================
   FORMULÁRIO DE PUBLICAÇÃO
   ========================================================= */

#publishForm{

  margin:0 20px 18px;

  border:1px solid #ddd;

  border-radius:12px;

  padding:15px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.05);

}


#publishForm h4{

  font-size:15px;

  margin-bottom:12px;

}


.file-btn-row{

  display:flex;

  align-items:center;

  gap:10px;

}


.file-label-btn{

  background:var(--black);

  color:var(--white);

  padding:8px 12px;

  border-radius:8px;

  font-size:12px;

  white-space:nowrap;

  cursor:pointer;

}


.file-name{

  font-size:12px;

  color:#555;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


/* =========================================================
   RESPONSIVO
   ========================================================= */

@media(max-width:800px){

  header.app-header{

    flex-wrap:wrap;

  }


  .company-section{

    order:-1;

    width:100%;

    margin-bottom:8px;

  }


  footer{

    grid-template-columns:1fr;

    gap:15px;

    text-align:center;

  }


  .footer-left{

    text-align:center;

  }


  .socials{

    grid-column:1;

    grid-row:2;

  }


  footer > span{

    grid-column:1;

    grid-row:3;

    text-align:center;

  }

}


@media(max-width:520px){

  .user-section .user-name{

    display:none;

  }


  header.app-header{

    padding:12px 16px;

  }


  #profileSidebar{

    width:90vw;

  }

}

</style>

</head>

    <img

      alt="Avatar"
    >

    <div class="user-name" id="headerUserName">

      Visitante

      <small>@saepvision</small>

    </div>

    <button
      class="btn-ver-perfil"
      id="btnVerPerfil"

      Ver perfil

    </button>

  </div>


  <div class="company-section">

  </div>


  <div class="login-section">

    <button
      class="btn-login-header"

    >

    <button
      class="btn-logout hidden"

      <circle
        cx="11"
        cy="11"

      <line
        x1="21"
        y1="21"
        x2="16.65"

    </svg>

  </div>


  <div
    style="
      text-align:center;

      font-size:13px;

  <div

  <div

</main>

</footer>



<!-- =======================================================
     LOGIN
     ======================================================= -->

<div
  class="modal-overlay hidden"
  id="loginModalOverlay"
>

  <div class="modal-box">


    <button
      class="modal-close"
      id="closeLoginModal"
    >

      &times;

    </button>


    <h2>Login</h2>


    <form id="loginForm" novalidate>


      <div class="field">

        <label for="emailInput">
          E-mail
        </label>

        <input
          type="text"
          id="emailInput"
          placeholder="Digite seu email"
        >

        <div
          class="field-error"
          id="emailError"
        ></div>

      </div>


      <div class="field">

        <label for="senhaInput">
          Senha
        </label>

        <input
          type="password"
          id="senhaInput"
          placeholder="Digite sua senha"
        >

        <div
          class="field-error"
          id="senhaError"
        ></div>

      </div>


      <div
        class="form-error"
        id="loginFormError"
      ></div>


      <div class="modal-actions">

        <button
          type="button"
          class="btn-cancel"
          id="cancelLoginBtn"
        >

          Cancelar

        </button>


        <button
          type="submit"
          class="btn-submit"
        >

          Login

        </button>

      </div>


    </form>

  </div>

</div>



<!-- =======================================================
     SIDEBAR DO PERFIL
     ======================================================= -->

<div
  class="sidebar-overlay hidden"
  id="sidebarOverlay"
></div>


<div
  class="sidebar"
  id="profileSidebar"
>


  <div class="sidebar-header">


    <button
      class="close-btn"
      id="closeSidebarBtn"
    >

      &times;

    </button>


    <h3 id="sidebarUserName">

      Fotógrafo

    </h3>


    <div class="sidebar-stats">


      <div class="stat">

        <div
          class="num"
          id="statLikes"
        >
          0
        </div>

        <div class="label">
          likes
        </div>

      </div>


      <div class="stat">

        <div
          class="num"
          id="statPubs"
        >
          0
        </div>

        <div class="label">
          publicações
        </div>

      </div>


    </div>

  </div>



  <!-- BOTÕES -->

  <div class="sidebar-buttons">


    <button
      class="btn-sidebar btn-publicacoes"
      id="btnSuasPublicacoes"

const STORAGE_KEY =

function salvarDados(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify({

      publicacoes:
        db.publicacoes,

      curtidas:
        db.curtidas

    })

  );

}


function carregarDados(){

  try{

    const dadosSalvos =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!dadosSalvos){

      return;

    }


    const dados =
      JSON.parse(dadosSalvos);


    if(
      Array.isArray(
        dados.publicacoes
      )
    ){

      db.publicacoes =
        dados.publicacoes;

    }


    if(
      Array.isArray(
        dados.curtidas
      )
    ){

      db.curtidas =
        dados.curtidas;

    }


    const maiorId =
      db.publicacoes.reduce(

        (maior,pub) =>

          Math.max(
            maior,
            Number(pub.id) || 0
          ),

        0

      );


    nextPubId =
      maiorId + 1;


  }catch(erro){

    console.warn(
      'Erro ao carregar dados.',
      erro
    );

  }

}

function getFotografoById(id){

  return db.usuarios.find(

}


function countLikes(pubId){

  return db.curtidas.filter(
    c => c.publicacaoId === pubId
  ).length;

}


function userLiked(userId,pubId){

  return db.curtidas.some(

    c =>
      c.usuarioId === userId &&
      c.publicacaoId === pubId

  );

}


function totalLikesDoFotografo(fotografoId){

  const pubs =
    db.publicacoes

      .filter(
        p =>
          p.fotografoId ===
          fotografoId
      )

      .map(
        p => p.id
      );


  return db.curtidas.filter(

    c =>
      pubs.includes(
        c.publicacaoId
      )

  ).length;

}


function totalPublicacoesDoFotografo(fotografoId){

  return db.publicacoes.filter(

    p =>
      p.fotografoId ===
      fotografoId

  ).length;

}

function heartSvg(liked){

  const color =
    liked
      ? 'rgb(255,0,0)'
      : 'rgb(0,0,0)';


  return `

    <svg
      viewBox="0 0 24 24"
      fill="${liked ? color : 'none'}"
      stroke="${color}"
      stroke-width="2"
    >

      <path
        d="
          M12 21
          s-7.5-4.6-10-9.3
          C0.3 8.4 2 4.5 5.7 4
          c2-.3 3.8.7 6.3 3.2
          C14.5 4.7 16.3 3.7 18.3 4
          c3.7.5 5.4 4.4 3.7 7.7
          C19.5 16.4 12 21 12 21z
        "
      ></path>

    </svg>

  `;

}

  list.forEach(pub => {

      getFotografoById(

    const liked =
      currentUser

    card.className =

    card.innerHTML = `

        <button

function toggleLike(pubId){

  if(!currentUser){

    abrirLoginModal();

    return;

  }


  const jaCurtiu =
    userLiked(
      currentUser.id,
      pubId
    );


  if(jaCurtiu){

    db.curtidas =
      db.curtidas.filter(

        c =>
          !(
            c.usuarioId ===
              currentUser.id &&

            c.publicacaoId ===
              pubId
          )

      );


  }else{

    db.curtidas.push({

      usuarioId:
        currentUser.id,

      publicacaoId:
        pubId

    });

  }


  salvarDados();

  aplicarBusca();


  if(
    !profileSidebar
      .classList
      .contains('hidden')
  ){

    renderSidebar();

  }

}


/* =========================================================
   BUSCA
   ========================================================= */

function aplicarBusca(){

  const termoRaw =
    document
      .getElementById(
        'searchInput'
      )
      .value
      .trim();


  if(termoRaw === ''){

    renderGallery(
      db.publicacoes
    );

    return;

  }


  const termo =
    termoRaw
      .replace(/^@/,'')
      .toLowerCase();


  const fotografo =
    db.usuarios.find(

      u =>

        u.tipo === 'fotografo' &&

        (

          u.username
            .toLowerCase()
            === termo ||

          u.nome
            .toLowerCase()
            .includes(termo)

        )

    );


  if(!fotografo){

    document
      .getElementById(
        'gallery'
      )
      .classList
      .add('hidden');


    const msg =
      document.getElementById(
        'searchMessage'
      );


    msg.classList
      .remove('hidden');


    msg.textContent =
      'Fotógrafo não encontrado.';

    return;

  }


  const pubsDoFotografo =
    db.publicacoes.filter(

      p =>
        p.fotografoId ===
        fotografo.id

    );


  renderGallery(
    pubsDoFotografo
  );

}

document

  .addEventListener(
    'submit',
    function(e){

      e.preventDefault();


      const emailInput =
        document.getElementById(
          'emailInput'
        );


      const senhaInput =
        document.getElementById(
          'senhaInput'
        );


      const emailError =
        document.getElementById(
          'emailError'
        );


      const senhaError =
        document.getElementById(
          'senhaError'
        );


      const loginFormError =
        document.getElementById(
          'loginFormError'
        );


      emailError.textContent = '';

      senhaError.textContent = '';

      loginFormError.textContent = '';


      let valido = true;


      const emailRegex =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


      if(
        !emailRegex.test(
          emailInput.value.trim()
        )
      ){

        emailError.textContent =
          'Formato de e-mail inválido.';

        valido = false;

      }


      if(
        senhaInput.value.trim() === ''
      ){

        senhaError.textContent =
          'A senha é obrigatória.';

        valido = false;

      }


      if(!valido){

        return;

      }


      const usuario =
        db.usuarios.find(

          u =>

            u.email.toLowerCase()
              ===
            emailInput.value
              .trim()
              .toLowerCase()

            &&

            u.senha ===
              senhaInput.value

        );


      if(!usuario){

        loginFormError.textContent =
          'Credenciais inválidas.';

        return;

      }


      currentUser =
        usuario;


      fecharLoginModal();

      renderHeader();

      aplicarBusca();

    }
  );

function excluirPublicacao(pubId){

  const confirmar =
    confirm(
      'Tem certeza que deseja excluir esta publicação?'
    );


  if(!confirmar){

    return;

  }


  db.publicacoes =
    db.publicacoes.filter(

      p =>
        p.id !== pubId

    );


  db.curtidas =
    db.curtidas.filter(

      c =>
        c.publicacaoId !== pubId

    );


  salvarDados();

  renderSidebar();

  renderOwnPubList();

  aplicarBusca();

}

        'image/jpeg',
        'image/jpg',
        'image/png',
        'image/gif',
        'image/webp'

      ];


      if(
        !tiposValidos.includes(
          file.type
        )
      ){

        fileNameLabel.textContent =
          'Nenhum arquivo selecionado';


        imagemError.textContent =
          'Formato inválido.';


        imagemInput.value = '';

        return;

      }


      fileNameLabel.textContent =
        file.name;


      const reader =
        new FileReader();


      reader.onload =
        function(e){

          arquivoSelecionadoBase64 =
            e.target.result;

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================================================
   LIMPAR FORMULÁRIO
   ========================================================= */

function resetPublishForm(){

  document.getElementById(
    'tituloInput'
  ).value = '';


  document.getElementById(
    'localInput'
  ).value = '';


  imagemInput.value = '';


  fileNameLabel.textContent =
    'Nenhum arquivo selecionado';


  arquivoSelecionadoBase64 =
    null;


  document.getElementById(
    'tituloError'
  ).textContent = '';


  document.getElementById(
    'localError'
  ).textContent = '';


  document.getElementById(
    'imagemError'
  ).textContent = '';

}


/* =========================================================
   CADASTRAR PUBLICAÇÃO
   ========================================================= */

publishForm
  .addEventListener(
    'submit',
    function(e){

      e.preventDefault();


      if(
        !currentUser ||
        currentUser.tipo !== 'fotografo'
      ){

        return;

      }


      const tituloInput =
        document.getElementById(
          'tituloInput'
        );


      const localInput =
        document.getElementById(
          'localInput'
        );


      const tituloError =
        document.getElementById(
          'tituloError'
        );


      const localError =
        document.getElementById(
          'localError'
        );


      const imagemError =
        document.getElementById(
          'imagemError'
        );


      tituloError.textContent = '';

      localError.textContent = '';

      imagemError.textContent = '';


      let valido = true;


      if(
        tituloInput.value.trim() === ''
      ){

        tituloError.textContent =
          'O título da imagem é obrigatório.';

        valido = false;

      }


      if(
        localInput.value.trim() === ''
      ){

        localError.textContent =
          'A fonte de origem é obrigatória.';

        valido = false;

      }


      if(
        !arquivoSelecionadoBase64
      ){

        imagemError.textContent =
          'A imagem é obrigatória.';

        valido = false;

      }


      if(!valido){

        return;

      }


      db.publicacoes.push({

        id:
          nextPubId++,

        fotografoId:
          currentUser.id,

        titulo:
          tituloInput.value.trim(),

        local:
          localInput.value.trim(),

        imagem:
          arquivoSelecionadoBase64

      });


      salvarDados();


      resetPublishForm();


      publishForm
        .classList
        .add('hidden');


      renderSidebar();


      aplicarBusca();


      ownPublicationsPanel
        .classList
        .remove('hidden');


      renderOwnPubList();

    }
  );


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

carregarDados();

renderHeader();

renderGallery(
  db.publicacoes
);

</script>
